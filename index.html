<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>
        <button class="button-close" type="button">
            <img src="icons/close.png" alt="Close icon" width="12">
        </button>

        <section>
            <h3 class="title">Login | <span>Register</span></h3>
        </section>

        <section>
            <p class="form-description">Enter your email and password to register.</p>

            <form action="#" method="post">

                <p>
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </p>

                <p>
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </p>

                <p>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </p>

                <p>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password"
                        required>
                </p>

                <p>
                    <button type="submit" class="submit-button">Register</button>
                </p>

            </form>
        </section>


        <section class="actions">
            <p class="action-description">Or register with</p>

            <button type="button" class="action-button">
                <img src="icons/google.png" alt="Google icon" width="20">
                <span>Continue with Google</span>
            </button>

            <br>

            <button type="button" class="action-button">
                <img src="icons/facebook.png" alt="Facebook icon" width="20">
                <span>Continue with Facebook</span>
            </button>
        </section>
    </main>

</body>

</html>
