<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <div class="container">

            <a href="#" class="logo">
                <img src="images/logo.png" alt="GreenShop">
            </a>

            <nav class="nav">
                <ul class="menu">
                    <li class="menu-item">
                        <a href="#" class="menu-link active">Home</a>
                    </li>
                    <li class="menu-item"><a class="menu-link" href="#">Shop</a></li>
                    <li class="menu-item"><a class="menu-link" href="#">Plant Care</a></li>
                    <li class="menu-item"><a class="menu-link" href="#">Blogs</a></li>
                </ul>
            </nav>

            <button type="button" class="login-btn">
                <img src="images/logout.png" alt="Login icon">
                <span>Login</span>
            </button>

        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">

                <div class="hero-content">
                    <p class="hero-subtitle">Welcome to GreenShop</p>
                    <h1 class="hero-title">
                        Let’s make a better <span>planet</span>
                    </h1>
                    <p class="hero-text">
                        We are an online plant shop offering a wide range of cheap and trendy plants. Use our plants to
                        create an unique Urban Jungle. Order your favorite plants!
                    </p>
                    <a href="#" class="btn">Shop now</a>
                </div>

                <div class="hero-image">
                    <img src="images/plant.png" alt="Plant">
                </div>

            </div>
        </section>
    </main>

</body>

</html>
